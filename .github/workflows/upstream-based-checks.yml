name: Upstream-based checks

on:
  pull_request:
    branches: [personal/upstream-based]

permissions:
  contents: read

concurrency:
  group: upstream-based-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vst3:
    name: Windows VST3 and focused tests
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download pinned dependencies
        shell: powershell
        run: scripts/github_actions/fetch-windows-deps.ps1

      - name: Configure
        run: cmake --preset windows-ara-vs2022 -DOPENTUNE_BUILD_TESTS=ON

      - name: Build
        run: >-
          cmake --build --preset windows-ara-release
          --target OpenTune_VST3 OpenTuneAutoTuneTests OpenTunePlaybackCacheRealtimeTests OpenTunePitchReferenceTests OpenTuneTimeStretchTests ARALifecycleContractTests OpenTuneAppPreferencesEditorSizeTests OpenTuneSelectedNoteResetTests

      - name: Test
        run: >-
          ctest --test-dir build-ara-overlay-vs18-clean -C Release
          --output-on-failure --no-tests=error
          -R '^(AutoTunePitchShifterTests|PlaybackCacheRealtimeTests|PitchReferenceTests|TimeStretchTests|ARALifecycleContractTests|AppPreferencesEditorSizeTests|SelectedNoteResetTests)$'

  macos:
    name: macOS Universal2 build
    # Match the release runner; the Universal2 preset also compiles for Apple silicon.
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: command -v ninja || brew install ninja

      - name: Download pinned dependencies
        run: bash scripts/github_actions/fetch-macos-deps.sh

      - name: Restore cached ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ThirdParty/onnxruntime-osx-universal2-1.20.0
          key: onnxruntime-osx-universal2-1.20.0-${{ hashFiles('scripts/build-onnxruntime-macos.sh') }}

      - name: Build ONNX Runtime Universal2
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-onnxruntime-macos.sh

      - name: Configure
        run: cmake --preset macos-universal2-ara-ninja

      - name: Build VST3, AU and standalone
        run: >-
          cmake --build --preset macos-universal2-ara-release
          --target OpenTune_VST3 OpenTuneAU_AU OpenTuneStandalone_Standalone
          --parallel 3
